services:
  webapp:
    build: .
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      TZ: Asia/Ho_Chi_Minh
      ConnectionStrings__DefaultConnection: Server=db;Database=${MYSQL_DATABASE:-bitrix_checker};User=root;Password=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env};
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY (at least 32 characters) in .env}
      Jwt__Issuer: ${JWT_ISSUER:-BitrixChecker}
      Jwt__Audience: ${JWT_AUDIENCE:-BitrixCheckerUsers}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
      SeedAdmin__UserName: ${SEED_ADMIN_USERNAME:?Set SEED_ADMIN_USERNAME in .env}
      SeedAdmin__Email: ${SEED_ADMIN_EMAIL:?Set SEED_ADMIN_EMAIL in .env}
      SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-bitrix_checker}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h localhost -uroot || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  mysql_data:
