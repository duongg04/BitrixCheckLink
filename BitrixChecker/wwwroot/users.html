<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý người dùng - BitrixChecker</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f6f8fa;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --green-bg: #d1fae5;
            --green-text: #065f46;
        }
        body { background: var(--bg-body); color: var(--text-primary); font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }
        .btn-primary { background: var(--accent); border-color: var(--accent); }
        .btn-primary:hover, .btn-primary:focus { background: var(--accent-hover); border-color: var(--accent-hover); }
        .form-control, .form-select { background: #fff; border-color: var(--border-color); color: var(--text-primary); }
        .form-control:focus, .form-select:focus { background: #fff; color: var(--text-primary); box-shadow: 0 0 0 .2rem rgba(37,99,235,.12); border-color: var(--accent); }
        .table-stats td { border-color: var(--border-color); color: var(--text-primary); vertical-align: middle; }
        .table-stats th { color: var(--text-secondary); border-color: var(--border-color); }
        .toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 1080; }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm">
        <div class="container-fluid px-4 py-2">
            <a class="navbar-brand mb-0 fw-bold" href="/index.html" style="color: var(--accent);">BitrixChecker</a>
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <a href="/index.html" class="btn btn-outline-primary btn-sm"><i class="bi bi-arrow-left"></i> Quay lại Dashboard</a>
                <span id="whoami" class="text-muted small"></span>
                <button id="btn-logout" class="btn btn-outline-danger btn-sm" onclick="logout()">Đăng xuất</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4 px-4">
        <div id="toast-container" class="toast-container"></div>

        <div class="card p-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 class="mb-0"><i class="bi bi-people"></i> Quản lý người dùng</h4>
                <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#create-user-modal">
                    <i class="bi bi-person-plus-fill"></i> Thêm người dùng mới
                </button>
            </div>

            <div class="table-responsive">
                <table class="table table-stats table-hover mb-0 align-middle">
                    <thead>
                        <tr>
                            <th>Tên đăng nhập</th>
                            <th>Tên hiển thị</th>
                            <th>Email</th>
                            <th>Vai trò</th>
                            <th>User ID</th>
                        </tr>
                    </thead>
                    <tbody id="users-table">
                        <tr><td colspan="5" class="text-center py-4"><div class="spinner-border spinner-border-sm text-primary"></div> Đang tải...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal Thêm người dùng -->
    <div class="modal fade" id="create-user-modal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Thêm người dùng mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <form id="create-user-form" onsubmit="createUser(event)">
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="new-username">Tên đăng nhập <span class="text-danger">*</span></label>
                            <input type="text" class="form-control form-control-sm" id="new-username" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="new-password">Mật khẩu <span class="text-danger">*</span></label>
                            <input type="password" class="form-control form-control-sm" id="new-password" required autocomplete="new-password" placeholder="Tối thiểu 6 ký tự, có chữ hoa, chữ thường, số, ký tự đặc biệt">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="new-displayname">Tên hiển thị</label>
                            <input type="text" class="form-control form-control-sm" id="new-displayname" placeholder="Ví dụ: Nguyễn Văn A">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="new-email">Email</label>
                            <input type="email" class="form-control form-control-sm" id="new-email" placeholder="user@company.com">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small text-muted" for="new-role">Vai trò</label>
                            <select class="form-select form-select-sm" id="new-role">
                                <option value="User" selected>User (Sales Team)</option>
                                <option value="Admin">Admin (Quản trị viên)</option>
                            </select>
                        </div>
                        <div id="create-error" class="alert alert-danger d-none small"></div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary btn-sm" id="btn-save-user">
                                <i class="bi bi-check-lg"></i> Tạo người dùng
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/auth.js"></script>
    <script src="/users.js"></script>
</body>
</html>
