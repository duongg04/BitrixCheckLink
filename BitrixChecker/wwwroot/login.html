<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Đăng nhập - BitrixChecker</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #eef2ff 0%, #f4f6fb 45%, #ffffff 100%); color: #1e293b; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 8px 30px rgba(37, 99, 235, 0.10); }
        .form-control { border: 1px solid #e2e8f0; color: #1e293b; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12); border-color: #2563eb; }
        .btn-primary { background: #2563eb; border-color: #2563eb; }
        .btn-primary:hover { background: #1d4ed8; border-color: #1d4ed8; }
        .brand { color: #2563eb; font-weight: 700; }
    </style>
</head>
<body>
    <div class="login-card p-5">
        <h2 class="text-center mb-4">Đăng nhập <span class="brand">BitrixChecker</span></h2>
        <form id="login">
            <div class="mb-3">
                <label for="username" class="form-label">Tên đăng nhập hoặc email</label>
                <input type="text" id="username" class="form-control" placeholder="admin@example.com" autocomplete="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Mật khẩu</label>
                <div class="input-group">
                    <input type="password" id="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
                    <button type="button" class="btn btn-outline-secondary" id="btn-toggle-password" aria-label="Hiện mật khẩu" title="Hiện/Ẩn mật khẩu"><i class="bi bi-eye"></i></button>
                </div>
            </div>
            <div id="error-msg" class="alert alert-danger py-2 mb-3 d-none" role="alert" aria-live="polite"></div>
            <button type="submit" class="btn btn-primary w-100" id="btn-login">
                <span id="login-spinner" class="spinner-border spinner-border-sm d-none me-1" aria-hidden="true"></span>
                <span id="login-label">Đăng nhập</span>
            </button>
        </form>
        <p class="text-center mt-3 text-muted small">Phiên bản nội bản - IT Team</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const toggleBtn = document.getElementById('btn-toggle-password');
        if (toggleBtn) {
            toggleBtn.addEventListener('click', () => {
                const pInput = document.getElementById('password');
                const isHidden = pInput.type === 'password';
                pInput.type = isHidden ? 'text' : 'password';
                toggleBtn.innerHTML = isHidden ? '<i class="bi bi-eye-slash"></i>' : '<i class="bi bi-eye"></i>';
                toggleBtn.setAttribute('aria-label', isHidden ? 'Ẩn mật khẩu' : 'Hiện mật khẩu');
            });
        }
        document.getElementById('login').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errorMsg = document.getElementById('error-msg');
            btn.disabled = true;
            btn.setAttribute('aria-busy', 'true');
            document.getElementById('login-spinner').classList.remove('d-none');
            document.getElementById('login-label').textContent = 'Đang đăng nhập...';
            errorMsg.classList.add('d-none');
            try {
                const r = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userName: username.value, password: password.value })
                });
                let d = {};
                try { d = await r.json(); } catch { /* non-JSON body */ }
                if (!r.ok) {
                    const msg = d.message
                        || (r.status === 429 ? 'Quá nhiều lần thử. Vui lòng chờ 1 phút rồi thử lại.'
                            : r.status === 401 ? 'Tên đăng nhập hoặc mật khẩu không đúng.'
                            : r.status === 400 ? 'Dữ liệu không hợp lệ.'
                            : 'Lỗi máy chủ (' + r.status + ').');
                    errorMsg.textContent = msg;
                    errorMsg.classList.remove('d-none');
                } else {
                    sessionStorage.setItem('token', d.token);
                    location.assign('/');
                }
            } catch (err) {
                errorMsg.textContent = 'Không kết nối được máy chủ. Hãy kiểm tra máy chủ đang chạy và thử lại.';
                errorMsg.classList.remove('d-none');
            } finally {
                btn.disabled = false;
                document.getElementById('login-spinner').classList.add('d-none');
                document.getElementById('login-label').textContent = 'Đăng nhập';
                btn.removeAttribute('aria-busy');
            }
        });
    </script>
</body>
</html>
