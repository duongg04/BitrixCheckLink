<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Link đang hoạt động - BitrixChecker</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #f6f8fa;
            --bg-card: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
        }
        body { background: var(--bg-body); color: var(--text-primary); font-family: 'Segoe UI', system-ui, sans-serif; }
        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.04); }
        .table { --bs-table-bg: transparent; }
        .table td, .table th { border-color: var(--border-color); color: var(--text-primary); vertical-align: middle; }
        .table thead th { color: var(--text-secondary); background: #f8fafc; }
        a { color: var(--accent); }
        a:hover { text-decoration: underline; }
        textarea.form-control { min-height: 4rem; }
        .table-responsive table { min-width: 760px; }
        .url-cell { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .btn:focus-visible, .form-control:focus-visible, a:focus-visible { outline: 2px solid var(--accent) !important; outline-offset: 2px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-light bg-white border-bottom shadow-sm">
        <div class="container-fluid px-4 py-2">
            <a class="navbar-brand fw-bold mb-0" href="/" style="color: var(--accent);"><i class="bi bi-link-45deg"></i> BitrixChecker</a>
            <span class="text-muted small d-none d-md-inline">Quản lý link đang hoạt động</span>
            <button class="btn btn-outline-danger btn-sm" onclick="logout()">Đăng xuất</button>
        </div>
    </nav>

    <div class="container py-4">
        <h1 class="h3 mb-3">Link đang hoạt động</h1>
        <p id="summary" class="text-muted"></p>

        <div id="admin-actions" class="d-flex gap-2 mb-3 d-none">
            <button class="btn btn-outline-danger btn-sm" onclick="exportCsv()"><i class="bi bi-download"></i> Xuất CSV</button>
            <a class="btn btn-outline-secondary btn-sm" href="/hangfire" title="Hangfire Dashboard - yêu cầu xác thực JWT">Hangfire (Admin)</a>
        </div>

        <div class="card p-4">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle" aria-label="Danh sách link hoạt động">
                    <thead>
                        <tr>
                            <th class="text-muted fw-semibold">Subdomain</th>
                            <th class="text-muted fw-semibold">URL</th>
                            <th class="text-muted fw-semibold">HTTP</th>
                            <th class="text-muted fw-semibold">Kiểm tra gần nhất</th>
                            <th class="text-muted fw-semibold">Ghi chú Sales</th>
                        </tr>
                    </thead>
                    <tbody id="links"></tbody>
                </table>
            </div>
            <div class="d-flex justify-content-between align-items-center mt-3">
                <button id="previous" class="btn btn-outline-secondary btn-sm">Trước</button>
                <span id="page" class="text-muted small"></span>
                <button id="next" class="btn btn-outline-secondary btn-sm">Sau</button>
            </div>
        </div>
    </div>

    <script src="/auth.js"></script>
    <script src="/manage.js"></script>
</body>
</html>
